name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/puracator-website-rebuild-vk3ldz]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: GitHub Pages must be enabled once by a repo admin —
      # Settings → Pages → Build and deployment → Source → "GitHub Actions".
      # The default GITHUB_TOKEN is not permitted to enable it automatically.

      # If a custom domain (public/CNAME) is present, serve from the root ("").
      # Otherwise serve from the project sub-path, e.g. /Puracator.
      - name: Compute base path
        id: bp
        run: |
          if [ -f public/CNAME ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (static export)
        env:
          PAGES_BASE_PATH: ${{ steps.bp.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping IndexNow
        run: |
          curl -s -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json" \
            -d '{
              "host": "puracator.co.uk",
              "key": "0876d72c72628c635c8915b219b0900a",
              "keyLocation": "https://puracator.co.uk/0876d72c72628c635c8915b219b0900a.txt",
              "urlList": [
                "https://puracator.co.uk/",
                "https://puracator.co.uk/how-it-works/",
                "https://puracator.co.uk/products/",
                "https://puracator.co.uk/affiliated-products/",
                "https://puracator.co.uk/contact/"
              ]
            }' || true
